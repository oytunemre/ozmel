<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Özmel — Giriş</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="icon" type="image/svg+xml" href="img/ozmel-ikon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/favicon-180.png">
  <style>
    /* Tasarım sistemiyle aynı tokenler (app.css :root'tan) — login bağımsız sayfa. */
    :root {
      --navy: #1d2d3d;
      --accent: #5980a6; --accent-500: #749dc4; --accent-600: #597ea3; --accent-700: #416180;
      --text: #2b2b2d;
      --neutral-100: #f5f5f8; --neutral-300: #d4d4d7; --neutral-400: #b7b7ba; --neutral-600: #7a7a7d; --neutral-700: #5d5d60;
      --divider: color-mix(in srgb, #1d1f20 16%, transparent);
      --danger: #a33a32; --danger-fill: #f5e2e0;
      --font-heading: "Barlow Condensed", system-ui, sans-serif;
      --font-body: "Barlow", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font-body); color: var(--text); background: #fff; }

    .login { display: grid; grid-template-columns: 45% 1fr; min-height: 100vh; }

    /* Sol pano — koyu lacivert, ortada logo + tanım */
    .brandpane {
      background: var(--navy); color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; padding: 48px; text-align: center;
    }
    .logo { display: flex; justify-content: center; }
    .logo svg { width: 220px; height: auto; color: #fff; display: block; }
    .tag { font-size: 16px; line-height: 1.5; color: #aebfd0; max-width: 34ch; letter-spacing: .02em; }

    /* Sağ pano — beyaz, dikey ortalı form */
    .formpane { display: flex; align-items: center; justify-content: center; padding: 40px 32px; }
    .formcard { width: 100%; max-width: 360px; }
    .formcard h1 { font-family: var(--font-heading); font-size: 30px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .01em; margin: 0 0 4px; }
    .formcard .lead { font-size: 14px; color: var(--neutral-600); margin: 0 0 24px; }

    .err { display: none; background: var(--danger-fill); border: 1px solid var(--danger);
      color: var(--danger); padding: 10px 12px; font-size: 14px; line-height: 1.4; margin-bottom: 18px; }

    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; color: var(--neutral-700); margin-bottom: 6px; }
    .input { width: 100%; height: 42px; padding: 0 12px; font-family: var(--font-body); font-size: 15px;
      border: 1px solid var(--divider); background: #fff; border-radius: 0; }
    .input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

    .btn { width: 100%; height: 46px; margin-top: 6px; font-family: var(--font-body); font-size: 15px; font-weight: 500;
      background: var(--accent); color: #fff; border: 1px solid var(--accent-700); border-radius: 0; cursor: pointer; }
    .btn:hover:not(:disabled) { background: var(--accent-600); }
    .btn:disabled { opacity: .6; cursor: default; }

    .foot { margin-top: 22px; font-size: 12.5px; color: var(--neutral-600); line-height: 1.5; }

    /* Dar ekran (tablet): sol pano üste geçer, form tam genişlik */
    @media (max-width: 820px) {
      .login { grid-template-columns: 1fr; }
      .brandpane { padding: 32px 24px; gap: 10px; }
      .logo svg { width: 170px; }
      .tag { font-size: 14px; }
      .formpane { padding: 32px 24px 48px; }
    }
  </style>
</head>

      <div class="tag">Tedarikçi Kalite ve Üretim Takip Sistemi</div>
    </div>

    <div class="formpane">
      <form class="formcard" id="login-form" autocomplete="on" novalidate>
        <h1>Giriş</h1>
        <p class="lead">Hesabınızla oturum açın.</p>

        <div class="err" id="err" role="alert"></div>

        <div class="field">
          <label for="username">Kullanıcı adı</label>
          <input class="input" id="username" name="username" type="text" autocomplete="username" autofocus required>
        </div>
        <div class="field">
          <label for="password">Şifre</label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>

        <button class="btn" id="submit" type="submit">Giriş Yap</button>

        <div class="foot">Hesabınız yok mu? Kullanıcılar yönetici tarafından tanımlanır.</div>
      </form>
    </div>
  </div>

  <script>
    // Giriş uç noktası kök login.php (public → bir üst dizin).
    const LOGIN_URL = '../login.php';

    const form = document.getElementById('login-form');
    const errBox = document.getElementById('err');
    const btn = document.getElementById('submit');

    function showError(msg) { errBox.textContent = msg; errBox.style.display = 'block'; }
    function clearError() { errBox.style.display = 'none'; errBox.textContent = ''; }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();
      const username = form.username.value.trim();
      const password = form.password.value;
      if (!username || !password) { showError('Kullanıcı adı ve şifre gerekli'); return; }

      btn.disabled = true;
      const label = btn.textContent;
      btn.textContent = 'Giriş yapılıyor…';
      const restore = () => { btn.disabled = false; btn.textContent = label; };

      try {
        const res = await fetch(LOGIN_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { showError(data.error || 'Kullanıcı adı veya şifre hatalı'); restore(); return; }

        localStorage.setItem('sessionToken', data.token);
        localStorage.setItem('sessionRole', data.role || 'editor');
        localStorage.setItem('sessionUser', data.displayName || 'Kullanıcı');
        location.href = 'index.html';
      } catch {
        showError('Sunucuya ulaşılamadı — bağlantınızı kontrol edin');
        restore();
      }
    });
  </script>
