name: CI

on: [push, pull_request]

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP kur
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'


      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: PHP sözdizimi
        run: |
          hata=0
          while IFS= read -r -d '' f; do
            php -l "$f" || hata=1
          done < <(find src public tools -name "*.php" -print0)
          exit $hata

      - name: JS sözdizimi
        run: |
          hata=0
          while IFS= read -r -d '' f; do
            node --check "$f" || hata=1
          done < <(find public/js -name "*.js" -print0)
          exit $hata
          
      - name: i18n TR/EN dengesi
        run: |
          tr=$(grep -c "^\s*'" public/js/core/i18n.js)
          echo "Toplam anahtar satırı: $tr"