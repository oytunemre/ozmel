name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP kur
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: PHP sözdizimi
        run: find src public tools -name "*.php" -exec php -l {} \;

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS sözdizimi
        run: find public/js -name "*.js" -exec node --check {} \;